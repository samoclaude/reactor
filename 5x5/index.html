<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>КС 5×5</title>
<meta name="theme-color" content="#0A0D12">
<meta name="description" content="Командуй пятёркой на Dust 2: маршруты, гранаты, бомба. Пошаговая CS на двоих.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Russo+One&display=swap">
<style>
:root {
  --bg: #0A0D12; --bg2: #10151E; --panel: #151B26; --panel2: #1B2230; --line: #263043; --line2: #33405A;
  --fg: #EAF0F8; --muted: #8A95AB; --dim: #5E6A80;
  --t: #E9A23B; --ct: #5BAAF2;
  --money: #8BE28F; --red: #FF5454; --gold: #FFD15C; --ok: #67E3A6;
  --display: "Russo One", "Arial Black", system-ui, sans-serif;
  --ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--ui); -webkit-tap-highlight-color: transparent; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
[hidden] { display: none !important; }
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(90% 40% at 50% -10%, color-mix(in srgb, var(--side, var(--t)) 16%, transparent), transparent 70%); }
.vign { position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: 0; box-shadow: inset 0 0 90px 10px rgba(255, 50, 50, .5); }
body.bomb .vign { animation: vign 1.1s ease-in-out infinite; }
body.bomb.hurry .vign { animation-duration: .5s; }
@keyframes vign { 0%, 100% { opacity: .1; } 50% { opacity: .65; } }

.app { position: relative; z-index: 1; height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; height: 38px; flex: none; padding: 0 2px; }
.ibtn { width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: none; }
.ibtn:active { transform: scale(.94); }
.brand { font-family: var(--display); font-size: 15px; letter-spacing: .06em; margin-right: auto; display: flex; align-items: center; gap: 7px; }
.brand i { width: 9px; height: 9px; border-radius: 2px; background: var(--side, var(--t)); transform: rotate(45deg); box-shadow: 0 0 10px var(--side, var(--t)); }
.pill { height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; font-weight: 700; letter-spacing: .12em; display: inline-flex; align-items: center; gap: 6px; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.pill .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

/* HUD */
.hud { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin: 4px 0 6px; }
.tm { --c: var(--t); display: flex; align-items: center; gap: 7px; min-width: 0; padding: 5px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); position: relative; overflow: hidden; }
.tm::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--c); }
.tm.r { flex-direction: row-reverse; text-align: right; } .tm.r::before { inset: 0 0 0 auto; }
.tm.ct { --c: var(--ct); }
.tm .sd { font: 12px var(--display); padding: 2px 6px; border-radius: 6px; background: var(--c); color: #0b0f15; flex: none; }
.tm .nm { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.tm .sc { font: 22px/1 var(--display); flex: none; }
.tm .al { display: flex; gap: 2px; flex: none; }
.tm .al i { width: 5px; height: 12px; border-radius: 2px; background: var(--c); }
.tm .al i.d { background: var(--line2); }
.clock { text-align: center; min-width: 78px; }
.clock b { display: block; font: 20px/1 var(--display); letter-spacing: .03em; }
.clock small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
.clock.bomb b { color: var(--red); }

/* карта */
.mapwrap { position: relative; flex: none; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #07090C; }
#map { display: block; width: 100%; touch-action: none; }
.feed { position: absolute; right: 6px; top: 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; pointer-events: none; max-width: 70%; }
.feed div { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #000b; border: 1px solid #ffffff1a; white-space: nowrap; animation: feedin .25s ease-out; display: flex; align-items: center; gap: 5px; }
.feed div.mine { border-color: #ff5454aa; }
.feed .t { color: var(--t); } .feed .ct { color: var(--ct); } .feed .w { color: #cfd6e4; font-weight: 600; }
@keyframes feedin { from { transform: translateX(20px); opacity: 0; } }
.mapbtns { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 5px; }
.mbtn { height: 30px; min-width: 30px; padding: 0 8px; border-radius: 9px; border: 1px solid #ffffff22; background: #000a; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.mbtn.on { background: var(--fg); color: var(--bg); }
.banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; opacity: 0; }
.banner.go { animation: banner 1.6s ease-out forwards; }
.banner b { display: block; font: 21px var(--display); letter-spacing: .05em; padding: 6px 14px; border-radius: 10px; background: #000c; border: 2px solid currentColor; white-space: nowrap; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

/* панель под картой */
.panel { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 2px 10px; -webkit-overflow-scrolling: touch; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.4; text-wrap: pretty; margin: 0 2px 8px; }
.hint b { color: var(--fg); }
.ros { display: grid; grid-template-columns: repeat(5, 1fr) 44px; gap: 5px; margin-bottom: 8px; }
.chip { --c: var(--t); position: relative; padding: 5px 3px 4px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.chip.ct { --c: var(--ct); }
.chip .ri { width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #0b0f15; font: 12px/22px var(--display); text-align: center; }
.chip .cn { font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.chip .hp { width: 80%; height: 3px; border-radius: 2px; background: var(--line2); overflow: hidden; }
.chip .hp i { display: block; height: 100%; background: var(--ok); }
.chip .hp i.low { background: var(--red); }
.chip .od { position: absolute; top: 3px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.chip .bm { position: absolute; top: 2px; left: 3px; font-size: 10px; }
.chip.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--panel)); box-shadow: 0 0 0 1px var(--c) inset; }
.chip.dead { opacity: .4; }
.chip.dead .ri { background: var(--line2); color: var(--muted); }
.chip.all { justify-content: center; font: 12px var(--display); }
.card { border-radius: 14px; background: var(--panel); border: 1px solid var(--line); padding: 10px; margin-bottom: 8px; }
.uhead { display: flex; align-items: center; gap: 8px; }
.uhead .ri { width: 30px; height: 30px; border-radius: 50%; background: var(--side); color: #0b0f15; font: 15px/30px var(--display); text-align: center; flex: none; }
.uhead .un { font-weight: 800; font-size: 14px; } .uhead .ur { font-size: 11.5px; color: var(--muted); }
.uhead .uw { margin-left: auto; text-align: right; font-size: 12px; color: #cfd6e4; }
.uhead .uw small { display: block; color: var(--muted); font-size: 11px; }
.ustat { margin-top: 7px; font-size: 13px; padding: 7px 9px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); text-wrap: pretty; }
.ustat b { color: var(--gold); }
.row { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.sb { flex: 1 1 0; min-width: 0; height: 40px; border-radius: 11px; border: 1px solid var(--line2); background: var(--panel2); font-weight: 700; font-size: 12.5px; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 6px; white-space: nowrap; }
.sb.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.sb.warn { border-color: var(--red); color: var(--red); }
.sb.hot { background: color-mix(in srgb, var(--side) 25%, var(--panel2)); border-color: var(--side); }
.sb i { font-style: normal; font-size: 11px; opacity: .7; }
.sb:active { transform: scale(.97); }
.perk { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
.perk b { color: var(--fg); }

/* закупка */
.preset { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.brow { border-radius: 14px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 6px; overflow: hidden; }
.brow.open { border-color: var(--side); }
.bhead { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; background: none; text-align: left; }
.bhead .ri { width: 26px; height: 26px; border-radius: 50%; background: var(--side); color: #0b0f15; font: 13px/26px var(--display); text-align: center; flex: none; }
.bhead .bn { font-weight: 800; font-size: 13.5px; } .bhead .bg2 { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bhead .bm2 { margin-left: auto; text-align: right; font: 14px var(--display); color: var(--money); flex: none; }
.bhead .bm2 small { display: block; font: 600 11px var(--ui); color: var(--muted); }
.shop { padding: 0 10px 10px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 6px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; height: 30px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg2); font-size: 12px; font-weight: 700; }
.tab.on { background: var(--fg); color: var(--bg); }
.items { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.it { min-height: 46px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); padding: 5px 8px; text-align: left; display: flex; flex-direction: column; justify-content: center; }
.it b { font-size: 12.5px; } .it span { font-size: 11px; color: var(--money); } .it small { font-size: 10.5px; color: var(--muted); line-height: 1.25; }
.it.on { border-color: var(--side); background: color-mix(in srgb, var(--side) 22%, var(--panel2)); }
.it.have { border-style: dashed; }
.picked { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.picked button { height: 26px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--side); background: color-mix(in srgb, var(--side) 15%, transparent); font-size: 11.5px; font-weight: 700; }
.bombsel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }

/* нижняя панель */
.bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 2px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: linear-gradient(transparent, var(--bg) 30%); }
.sum { flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.sum b { color: var(--fg); }
.gobtn { flex: none; min-width: 120px; height: 48px; border: 0; border-radius: 15px; padding: 0 18px; font: 16px var(--display); letter-spacing: .03em; background: var(--side); color: #0b0f15; box-shadow: 0 10px 26px -12px var(--side); }
.gobtn:disabled { background: var(--panel2); color: var(--dim); box-shadow: none; opacity: 1; }
.gobtn:active:not(:disabled) { transform: scale(.97); }
.ghostbtn { flex: none; height: 48px; padding: 0 14px; border-radius: 15px; border: 1px solid var(--line2); background: var(--panel2); font-weight: 700; }
.pbar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--side); }

/* оверлеи */
.ov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(5, 7, 10, .72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.ovc { width: min(440px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 20px; background: var(--panel); border: 1px solid var(--line2); padding: 18px 16px 16px; text-align: center; animation: ovin .3s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes ovin { from { transform: translateY(16px) scale(.96); opacity: 0; } }
.ovc h2 { margin: 2px 0 6px; font: 30px/1.05 var(--display); letter-spacing: .03em; }
.ovc h2.t { color: var(--t); } .ovc h2.ct { color: var(--ct); }
.ovc .eb { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ovc p { color: #CBD3E1; font-size: 14px; margin: 6px 0; text-wrap: pretty; }
.ovc .big { font: 44px/1 var(--display); margin: 8px 0; }
.ovc .big i { font-style: normal; color: var(--dim); font-size: 28px; margin: 0 6px; }
.ovc .btns { display: flex; gap: 8px; margin-top: 14px; }
.ovc .btns button { flex: 1; height: 50px; border-radius: 15px; border: 1px solid var(--line2); background: var(--panel2); font: 15px var(--display); }
.ovc .btns button.main { border: 0; background: var(--fg); color: var(--bg); }
.stbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
.stbl td, .stbl th { padding: 4px 3px; text-align: right; } .stbl td:first-child, .stbl th:first-child { text-align: left; }
.stbl th { color: var(--muted); font-weight: 600; font-size: 11px; }
.stbl tr.tt td:first-child { color: var(--t); } .stbl tr.cc td:first-child { color: var(--ct); }
.stbl tr.mvp td { font-weight: 800; }
.inc { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
.inc div { padding: 6px 10px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); font-size: 12px; }
.inc b { color: var(--money); font: 15px var(--display); display: block; }
.tut { text-align: left; font-size: 13.5px; color: #CBD3E1; }
.tut li { margin: 5px 0; } .tut b { color: var(--fg); }
.log { display: flex; flex-direction: column; gap: 4px; }
.log div { font-size: 12.5px; padding: 6px 9px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); animation: feedin .25s ease-out; }
.log div.good { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); } .log div.bad { border-color: color-mix(in srgb, var(--red) 55%, var(--line)); }
.log b { font-weight: 800; }

/* меню */
.sheet { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: radial-gradient(120% 60% at 50% 0%, #1A2232, var(--bg) 70%); padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.sheet-in { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.logo { font: clamp(40px, 13vw, 58px)/0.95 var(--display); margin: 18px 0 0; }
.logo span { color: var(--t); } .logo i { color: var(--ct); font-style: normal; }
.tag { color: var(--muted); font-size: 14.5px; margin: -2px 0 4px; text-wrap: pretty; }
.cta { height: 58px; border: 0; border-radius: 17px; font: 17px var(--display); letter-spacing: .04em; background: var(--t); color: #1d1205; box-shadow: 0 14px 32px -14px var(--t); }
.cta.blue { background: var(--ct); color: #061521; box-shadow: 0 14px 32px -14px var(--ct); }
.cta.ghost { background: var(--panel); color: var(--fg); border: 1px solid var(--line2); box-shadow: none; }
.cta:active { transform: scale(.98); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg button { height: 44px; border-radius: 13px; border: 1px solid var(--line2); background: var(--panel); font-weight: 700; }
.seg button.on { background: var(--fg); color: var(--bg); }
.inp { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--line2); background: var(--panel); color: var(--fg); padding: 0 14px; font: 600 16px var(--ui); -webkit-user-select: text; user-select: text; }
.inp::placeholder { color: var(--dim); }
.join { display: flex; gap: 8px; }
.join .inp { text-align: center; font: 20px var(--display); letter-spacing: .35em; text-transform: uppercase; }
.join .cta { height: 50px; padding: 0 18px; font-size: 15px; flex: none; }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: -6px; }
.rules { border-radius: 16px; background: var(--panel); border: 1px solid var(--line); padding: 0 14px; }
.rules summary { list-style: none; cursor: pointer; padding: 14px 0; font-weight: 700; display: flex; justify-content: space-between; }
.rules summary::-webkit-details-marker { display: none; }
.rules summary::after { content: "+"; font: 18px var(--display); color: var(--muted); }
.rules[open] summary::after { content: "–"; }
.rules .rb { padding-bottom: 14px; font-size: 13.5px; line-height: 1.5; color: #CBD3E1; }
.rules h4 { margin: 12px 0 4px; font: 13px var(--display); color: var(--fg); }
.rules ul { margin: 4px 0; padding-left: 18px; } .rules li { margin: 3px 0; } .rules li::marker { color: var(--t); }
.room-code { font: clamp(46px, 15vw, 64px)/1 var(--display); letter-spacing: .16em; text-align: center; -webkit-user-select: text; user-select: text; }
.room-link { padding: 11px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-user-select: all; user-select: all; }
.seats { display: flex; flex-direction: column; gap: 6px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.seat .badge { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 12px var(--display); color: #0b0f15; }
.seat .st { margin-left: auto; font-size: 12px; color: var(--muted); } .seat .st.on { color: var(--ok); }
.netnote { font-size: 13px; color: var(--muted); text-align: center; text-wrap: pretty; } .netnote.err { color: var(--red); }
.foot { font-size: 12px; color: var(--dim); text-align: center; margin-top: 4px; }
.linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; padding: 6px; }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -20px); opacity: 0; z-index: 60; padding: 10px 16px; border-radius: 12px; background: #000d; border: 1px solid var(--line2); font-weight: 600; font-size: 14px; pointer-events: none; transition: all .25s; max-width: 90vw; text-align: center; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="vign"></div>

<div class="app" id="app">
  <div class="top">
    <button class="ibtn" id="btnMenu" aria-label="Меню"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="brand"><i></i>КС 5×5</div>
    <button class="pill" id="roomPill" hidden><span class="dot" id="roomDot"></span><span id="roomPillCode"></span></button>
    <button class="ibtn" id="btnHelp" aria-label="Подсказка">?</button>
    <button class="ibtn" id="btnSound" aria-label="Звук"></button>
  </div>
  <div class="hud" id="hud"></div>
  <div class="mapwrap" id="mapwrap">
    <canvas id="map"></canvas>
    <div class="feed" id="feed"></div>
    <div class="mapbtns" id="mapbtns"><button class="mbtn" id="btnZoom" aria-label="Приблизить">🔍</button></div>
    <div class="banner" id="banner"><b></b></div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="bar" id="bar"></div>
</div>

<div class="ov" id="ov" hidden><div class="ovc" id="ovc"></div></div>

<div class="sheet" id="sheet">

cv.addEventListener('pointermove', e => {

  if (Math.abs(dx) + Math.abs(dy) > 8) ptr.moved = true;
  if (ptr.moved && view.z > 1) { view.x = ptr.vx - dx / vk(); view.y = ptr.vy - dy / vk(); draw(); }

function snapWalk(x, y) {
  const cx0 = Math.floor(x), cy0 = Math.floor(y);
  if (K.walk(cx0, cy0)) return [cx0, cy0];
  let best = null, bd = 9;
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const a = cx0 + dx, b = cy0 + dy; if (!K.walk(a, b)) continue; const d = (a + 0.5 - x) ** 2 + (b + 0.5 - y) ** 2; if (d < bd) { bd = d; best = [a, b]; } }
  return best;
}
function formation(c, n) {
  const out = [], seen = new Set([c.join(',')]), q = [c];
  while (q.length && out.length < n) {
    const [x, y] = q.shift();
    if (out.every(([a, b]) => Math.abs(a - x) + Math.abs(b - y) >= 2)) out.push([x, y]);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const k = (x + dx) + ',' + (y + dy); if (!seen.has(k) && K.walk(x + dx, y + dy)) { seen.add(k); q.push([x + dx, y + dy]); } }
  }
  return out;
}
function onMapTap(px, py) {
  if (!S || S.over || PB) return;
  if (S.step !== 'turn' || !myPickNeeded()) return;
  draft();
  const [x, y] = toCell(px, py);
  // тап по своему бойцу — выбрать его
  let hit = null, hd = 1.6 * 1.6;
  for (const u of myUnits()) { if (!u.alive) continue; const d = (u.x - x) ** 2 + (u.y - y) ** 2; if (d < hd) { hd = d; hit = u; } }
  if (hit && D.mode === 'move' && !D.append) {
    if (D.multi) { const i = D.sel.indexOf(hit.slot); if (i >= 0) D.sel.splice(i, 1); else D.sel.push(hit.slot); }
    else D.sel = [hit.slot];
    sfx.tap(); render(); return;
  }
  if (!D.sel.length) { toast('Сначала выбери бойца'); return; }
  if (D.mode === 'look') {
    for (const slot of D.sel) setOrder(slot, o => { o.l = [Math.round(x * 4) / 4, Math.round(y * 4) / 4]; });
    D.mode = 'move'; sfx.tap(); render(); return;
  }
  if (D.mode === 'nade') {
    const c = snapWalk(x, y); if (!c) { toast('Сюда не кинуть'); return; }
    const slot = D.sel[0], t = D.nadeT;
    const ok = setOrder(slot, o => { o.n = { t, x: c[0] + 0.5, y: c[1] + 0.5, e: D.nadeE }; });
    if (!ok) { toast('Слишком далеко: граната летит до ' + K.NADES[t].rng + ' клеток'); return; }
    D.mode = 'move'; sfx.tap(); render(); return;
  }
  // идти
  const c = snapWalk(x, y); if (!c) { toast('Туда не пройти'); return; }
  if (D.sel.length === 1) {
    const slot = D.sel[0];
    const ok = setOrder(slot, o => { if (D.append && o.p && o.p.length) o.p = o.p.concat([c]); else o.p = [c]; });
    if (!ok) { toast('Туда не пройти'); return; }
  } else {
    const units = D.sel.map(s => S.units[me * 5 + s]).filter(u => u.alive);
    const spots = formation(c, units.length), left = units.slice();
    for (const sp of spots) {
      left.sort((a, b) => ((a.x - sp[0]) ** 2 + (a.y - sp[1]) ** 2) - ((b.x - sp[0]) ** 2 + (b.y - sp[1]) ** 2));
      const u = left.shift(); if (!u) break;
      setOrder(u.slot, o => { o.p = [sp]; });
    }
  }
  D.append = false;
  sfx.tap(); render();
}

    const pistolRound = S.round === 1 || S.round === S.half + 1;

    const hasPrim = u.prim && K.W[u.prim].cat !== 'pistol';

      const util = [['sm', 'fl', 'fl', 'mo', 'he'], ['fl', 'fl', 'he'], ['sm', 'fl', 'he'], ['fl', 'sm'], ['sm', 'fl', 'mo']][u.slot];

function createRoom() { joinRoom(newCode(), { code: '', host: null, seats: [null, null], names: [null, null], win: winPref, game: 0, sv: 0, picks: [], v: BUILD }); }
const NET_ERR = 'Не получается подключиться к серверу. Проверь интернет. В превью внутри Claude онлайн не работает, только на сайте.';
function connect() {

function leaveRoom() {

}
function onMsg(m) {

function onHello(m) {
  const r = net.room; if (!r) return;
  const id = String(m.from); let seat = r.seats.indexOf(id), changed = false;

function mergePicks(dst, src) {

function adoptState(s0) {
