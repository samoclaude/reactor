<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>КС-тактика</title>
<meta name="theme-color" content="#0B0E13">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Russo+One&display=swap">
<style>
:root {
  --bg: #0A0D12; --bg2: #10151E; --panel: #151B26; --panel2: #1B2230; --line: #263043; --line2: #33405A;
  --fg: #EAF0F8; --muted: #8A95AB; --dim: #5E6A80;
  --t: #E9A23B; --ct: #5BAAF2;
  --money: #8BE28F; --red: #FF5454; --gold: #FFD15C; --ok: #67E3A6;
  --display: "Russo One", "Arial Black", system-ui, sans-serif;
  --ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--ui); -webkit-tap-highlight-color: transparent; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
[hidden] { display: none !important; }
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(90% 40% at 50% -10%, color-mix(in srgb, var(--side, var(--t)) 18%, transparent), transparent 70%),
    linear-gradient(transparent 0 calc(100% - 1px), rgba(255,255,255,.025) 0) 0 0 / 100% 28px,
    linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(255,255,255,.025) 0) 0 0 / 28px 100%; }
.vign { position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: 0; box-shadow: inset 0 0 90px 10px rgba(255, 50, 50, .55); transition: opacity .6s; }
body.bomb .vign { animation: vign 1.1s ease-in-out infinite; }
body.bomb.hurry .vign { animation-duration: .55s; }
@keyframes vign { 0%, 100% { opacity: .15; } 50% { opacity: .75; } }
.flashfx { position: fixed; inset: 0; z-index: 70; pointer-events: none; background: #fff; opacity: 0; }
.flashfx.go { animation: flashfx .8s ease-out; }
@keyframes flashfx { 0% { opacity: 0; } 8% { opacity: .95; } 100% { opacity: 0; } }

.app { position: relative; z-index: 1; height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 8px; height: 40px; flex: none; }
.ibtn { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: none; }
.ibtn:active { transform: scale(.94); }
.brand { font-family: var(--display); font-size: 15px; letter-spacing: .06em; margin-right: auto; display: flex; align-items: center; gap: 7px; }
.brand i { width: 9px; height: 9px; border-radius: 2px; background: var(--t); transform: rotate(45deg); box-shadow: 0 0 10px var(--t); }
.pill { height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; font-weight: 700; letter-spacing: .12em; display: inline-flex; align-items: center; gap: 6px; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.pill .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

/* scoreboard */
.board { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 6px; }
.pl { --c: var(--t); min-width: 0; padding: 7px 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.pl::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--c); }
.pl.op { text-align: right; } .pl.op::before { inset: 0 0 0 auto; }
.pl.ct { --c: var(--ct); }
.pl-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.pl.op .pl-row { flex-direction: row-reverse; }
.badge { flex: none; height: 20px; min-width: 26px; padding: 0 5px; border-radius: 6px; display: grid; place-items: center; font: 12px var(--display); background: var(--c, var(--t)); color: #0A0D12; }
.badge.t { --c: var(--t); } .badge.ct { --c: var(--ct); }
.pl-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.money { font: 15px var(--display); color: var(--money); white-space: nowrap; }
.hpbar { height: 6px; border-radius: 99px; background: #0007; overflow: hidden; display: flex; }
.pl.op .hpbar { flex-direction: row-reverse; }
.hpbar span { display: block; background: linear-gradient(90deg, var(--ok), #b6f0c9); border-radius: 99px; transition: width .6s ease; }
.hpbar.low span { background: linear-gradient(90deg, var(--red), #ff9a7a); }
.gear { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; min-height: 15px; }
.pl.op .gear { justify-content: flex-end; }
.wic { width: 36px; height: 12px; flex: none; color: var(--fg); opacity: .9; }
.score { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.score .nums { font: 26px/1 var(--display); display: flex; gap: 6px; align-items: baseline; }
.score .nums i { color: var(--dim); font-style: normal; font-size: 18px; }
.score .ri { font-size: 11px; color: var(--muted); margin-top: 4px; white-space: nowrap; }

/* map */
.mapbox { flex: none; position: relative; margin-top: 8px; border-radius: 16px; background: radial-gradient(120% 90% at 50% 50%, #131A26, #0D1219); border: 1px solid var(--line); overflow: hidden; }
.mapbox svg { display: block; width: 100%; height: auto; max-height: 150px; }
.mapname { position: absolute; left: 9px; bottom: 6px; font: 10px var(--display); letter-spacing: .14em; color: var(--muted); padding: 3px 7px; border-radius: 7px; background: #000b; }
.zone { fill: #182030; stroke: #2B3750; stroke-width: 1.5; transition: fill .4s, stroke .4s; }
.zone.hot { fill: #3A1D22; stroke: var(--red); }
.zone.pick { stroke: var(--fg); stroke-dasharray: 5 4; animation: dash 1s linear infinite; }
.zone.bombz { fill: #3A1D22; stroke: var(--red); }
@keyframes dash { to { stroke-dashoffset: -18; } }
.lane { stroke: #1F2738; stroke-width: 10; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.zl { font: 30px var(--display); fill: #ffffff0b; text-anchor: middle; dominant-baseline: central; }
.zl.small { font-size: 15px; fill: #ffffff14; }
.spawn { font: 10px var(--display); text-anchor: middle; dominant-baseline: central; }
.pdot { fill: #2B3750; stroke: #3B4A68; stroke-width: 1; transition: all .3s; }
.pdot.d0 { fill: #FF545455; } .pdot.d1 { fill: #FFD15C44; } .pdot.d2 { fill: #5BAAF255; }
.pdot.sel { stroke: #fff; stroke-width: 2; }
.plabel { font: 700 9px var(--ui); fill: #fff; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: #0A0D12; stroke-width: 3px; }
.route { fill: none; stroke: var(--t); stroke-width: 3; stroke-dasharray: 7 6; stroke-linecap: round; animation: dash .7s linear infinite; }
.mk { transition: transform .9s cubic-bezier(.3,.75,.2,1), opacity .4s; }
.mk circle.core { stroke: #0A0D12; stroke-width: 2.5; }
.mk text { font: 8px var(--display); text-anchor: middle; dominant-baseline: central; fill: #0A0D12; }
.mk .ring { fill: none; stroke-width: 2; opacity: .7; transform-box: fill-box; transform-origin: center; animation: ring 1.6s ease-out infinite; }
@keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.2); opacity: 0; } }
.mk.dead circle.core { fill: #444 !important; }
.cline { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 3 4; animation: dash .5s linear infinite; }
.boom { fill: var(--gold); transform-box: fill-box; transform-origin: center; animation: pop 1s ease-in-out infinite; }
@keyframes pop { 50% { transform: scale(1.5); opacity: .5; } }
.bombic { transform-box: fill-box; transform-origin: center; animation: pop 1s ease-in-out infinite; }

/* round bar */
.rbar { flex: none; margin-top: 7px; display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 5px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; }
.rbar .lbl2 { font: 12px var(--display); letter-spacing: .05em; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.rbar .hint { margin-left: auto; color: var(--muted); font-size: 11.5px; text-align: right; line-height: 1.2; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 14px; height: 8px; border-radius: 3px; background: #ffffff1a; }
.pips i.used { background: #ffffff10; }
.pips i.now { background: var(--side); animation: blink 1s ease-in-out infinite; }
.pips i.left { background: color-mix(in srgb, var(--side) 55%, transparent); }
.pips.bomb i.left { background: var(--red); }
.pips.bomb i.now { background: var(--red); }
.pips.def i { width: 10px; height: 10px; border-radius: 50%; }
.pips.def i.left { background: var(--ok); }
@keyframes blink { 50% { opacity: .35; } }
.rbar.bomb { border-color: #FF545466; background: #2A1518; }

/* panel */
.panel { flex: 1; min-height: 0; overflow-y: auto; margin-top: 8px; padding-bottom: 12px; scrollbar-width: none; }
.panel::-webkit-scrollbar { display: none; }
.panel > * { animation: fadeup .35s ease both; }
@keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.situ { display: flex; gap: 10px; padding: 10px 12px; border-radius: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--side) 14%, var(--panel)), var(--panel)); border: 1px solid color-mix(in srgb, var(--side) 35%, var(--line)); margin-bottom: 4px; }
.situ .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: #0006; }
.situ .st { display: block; font: 15px var(--display); letter-spacing: .01em; margin-bottom: 2px; }
.situ span { color: #C9D2E0; font-size: 13px; line-height: 1.38; text-wrap: pretty; }
.sec { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 13px 0 7px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec b { color: var(--fg); letter-spacing: 0; text-transform: none; font-size: 12px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { --c: var(--fg); position: relative; text-align: left; min-width: 0; padding: 10px 11px; border-radius: 13px; background: var(--panel); border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s, transform .12s; }
.tile:active:not(:disabled) { transform: scale(.97); }
.tile.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--panel)); box-shadow: 0 0 0 1px var(--c) inset, 0 8px 20px -12px var(--c); }
.tile:disabled { opacity: .38; }
.tile .tt { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tile .tt span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .ts { font-size: 12px; color: var(--muted); line-height: 1.35; }
.tile .pr { font: 13px var(--display); color: var(--money); flex: none; }
.tile .have { position: absolute; top: -7px; right: 8px; font-size: 10px; font-weight: 800; letter-spacing: .1em; padding: 1px 6px; border-radius: 6px; background: var(--ok); color: #062615; }
.tile .wic { width: 56px; height: 18px; margin: 2px 0; color: color-mix(in srgb, var(--c) 40%, var(--fg)); }
.tile.on .wic { color: var(--c); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #ffffff10; color: var(--fg); white-space: nowrap; }
.chip.d0 { background: #FF545422; color: #ff9d9d; } .chip.d1 { background: #FFD15C22; color: var(--gold); } .chip.d2 { background: #5BAAF222; color: #9fd0ff; }
.chip.plus { background: #67E3A622; color: var(--ok); }
.pow { display: inline-flex; gap: 3px; align-items: flex-end; }
.pow i { display: flex; flex-direction: column; align-items: center; gap: 1px; font-style: normal; font-size: 9px; color: var(--dim); }
.pow i b { font: 12px var(--display); color: var(--fg); min-width: 15px; text-align: center; padding: 1px 3px; border-radius: 4px; background: #ffffff0d; }
.row { display: flex; gap: 8px; align-items: center; }
.cnt { display: inline-flex; align-items: center; gap: 6px; }
.cnt button { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line2); background: var(--panel2); font-weight: 800; font-size: 16px; }
.cnt b { font: 14px var(--display); min-width: 14px; text-align: center; }
.note { font-size: 12px; color: var(--muted); padding: 9px 11px; border-radius: 11px; background: #ffffff08; border: 1px dashed var(--line); margin-top: 10px; text-wrap: pretty; }
.note b { color: var(--fg); }
.loadout { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 34px; padding: 6px 8px; border-radius: 12px; background: #0005; border: 1px solid var(--line); margin-top: 8px; }
.loadout .it { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 7px; background: #ffffff10; font-size: 12px; font-weight: 700; animation: popin .3s cubic-bezier(.3,1.6,.5,1) both; }
.loadout .it.new { background: color-mix(in srgb, var(--side) 25%, transparent); }
.loadout .it .wic { width: 30px; height: 10px; }
.loadout em { font-style: normal; color: var(--dim); font-size: 12px; }
@keyframes popin { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }

/* matchup */
.mu { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); margin-top: 8px; }
.mu .side { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mu .side.r { align-items: flex-end; text-align: right; }
.mu .wn { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.mu .side.r .wn { flex-direction: row-reverse; }
.mu .wn .wic { width: 44px; height: 14px; }
.mu .pw { font-size: 12px; color: var(--muted); }
.mu .pw b { font: 15px var(--display); color: var(--fg); }
.mu .vs { font: 13px var(--display); color: var(--dim); }
.mini-hp { width: 100%; height: 5px; border-radius: 99px; background: #0007; overflow: hidden; }
.mini-hp span { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.mini-hp.low span { background: var(--red); }

/* actions */
.acts { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 8px; }
.act { --c: var(--fg); padding: 11px 6px 9px; border-radius: 14px; background: var(--panel); border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; transition: transform .12s, border-color .15s, background .15s; }
.act:active { transform: scale(.96); }
.act svg { width: 26px; height: 26px; }
.act b { font-size: 13px; line-height: 1.15; }
.act small { font-size: 10.5px; color: var(--muted); line-height: 1.25; }
.act.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 15%, var(--panel)); box-shadow: 0 0 0 1px var(--c) inset, 0 8px 22px -12px var(--c); }
.what { margin-top: 8px; padding: 9px 11px; border-radius: 13px; background: #0005; border: 1px solid var(--line); }
.what .wh { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.what .wr { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; padding: 3px 0; animation: fadeup .3s ease both; }
.what .wr .vs { flex: none; width: 98px; color: var(--muted); }
.what .wr .vs b { color: var(--fg); font-weight: 700; }
.what .wr .res { flex: 1; }
.what .wr .res::before { content: "→ "; color: var(--dim); }
.what .good .res { color: var(--ok); } .what .bad .res { color: #ff8b8b; } .what .mid .res { color: #E3D9B8; }
.nades { display: flex; gap: 6px; flex-wrap: wrap; }
.nade { height: 36px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.nade.on { border-color: var(--gold); background: #FFD15C1c; }
.nade i { font-style: normal; font-size: 11px; color: var(--muted); }

/* aim cards */
.hand { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 8px; }
.card { --cc: #8BB4FF; position: relative; min-height: 112px; padding: 8px 8px 9px; border-radius: 13px; background: linear-gradient(160deg, color-mix(in srgb, var(--cc) 24%, #1A2130), #121823 75%); border: 1.5px solid color-mix(in srgb, var(--cc) 45%, var(--line)); display: flex; flex-direction: column; align-items: flex-start; text-align: left; min-width: 0; transition: transform .18s, box-shadow .18s; overflow: hidden; }
.card::after { content: ""; position: absolute; right: -14px; bottom: -14px; width: 56px; height: 56px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--cc) 25%, transparent); }
.card.on { transform: translateY(-6px); border-color: var(--cc); box-shadow: 0 12px 26px -10px var(--cc), 0 0 0 1px var(--cc) inset; }
.card .cv { font: 28px/1 var(--display); color: var(--cc); }
.card .cn { font-weight: 800; font-size: 12.5px; margin-top: auto; line-height: 1.15; }
.card .cx { font-size: 10.5px; color: var(--muted); line-height: 1.25; margin-top: 3px; }
.card .now { position: absolute; top: 8px; right: 8px; font: 12px var(--display); padding: 2px 6px; border-radius: 6px; background: #000a; }
.card.pos { --cc: var(--ok); } .card.neg { --cc: var(--red); } .card.hs { --cc: var(--gold); } .card.cond { --cc: #8BB4FF; }
.card.mini { min-height: 0; padding: 7px 9px; flex-direction: row; align-items: center; gap: 8px; border-radius: 10px; width: 100%; }
.card.mini .cv { font-size: 17px; } .card.mini .cn { margin: 0; } .card.mini::after { display: none; }

/* bottom bar */
.bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.bar .sum { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); line-height: 1.3; }
.bar .sum b { color: var(--fg); }
.bar .sum .pw { font: 18px var(--display); color: var(--side); }
.gobtn { flex: none; height: 50px; min-width: 128px; padding: 0 20px; border: 0; border-radius: 15px; background: var(--side, var(--t)); color: #0A0D12; font: 16px var(--display); letter-spacing: .04em; box-shadow: 0 10px 26px -12px var(--side, var(--t)); transition: transform .1s; }
.gobtn:disabled { background: var(--panel2); color: var(--dim); box-shadow: none; }
.gobtn:not(:disabled):active { transform: scale(.96); }
.wait { display: flex; align-items: center; gap: 9px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--fg); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.waitbox { margin-top: 14px; padding: 18px 14px; border-radius: 16px; background: var(--panel); border: 1px dashed var(--line2); text-align: center; }
.waitbox .dots { display: inline-flex; gap: 6px; margin-bottom: 8px; }
.waitbox .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--side); animation: blink 1.2s ease-in-out infinite; }
.waitbox .dots i:nth-child(2) { animation-delay: .2s; } .waitbox .dots i:nth-child(3) { animation-delay: .4s; }

/* reveal */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: linear-gradient(to bottom, transparent 0 22%, color-mix(in srgb, var(--bg) 80%, transparent) 45%); padding: 12px max(12px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.rv { width: 100%; max-width: 520px; max-height: 76%; overflow-y: auto; border-radius: 24px; background: var(--panel); border: 1px solid var(--line2); padding: 15px 14px 14px; box-shadow: 0 -20px 60px -10px #000; animation: rise .38s cubic-bezier(.2,.8,.2,1); scrollbar-width: none; position: relative; }
.rv::-webkit-scrollbar { display: none; }
.rv.shake { animation: shake .45s ease; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translate(-7px, 2px) rotate(-.6deg); } 40% { transform: translate(6px, -2px) rotate(.5deg); } 60% { transform: translate(-4px, 1px); } 80% { transform: translate(3px, 0); } }
.rv-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.rv-title { font: 21px/1.15 var(--display); margin: 4px 0 10px; text-wrap: balance; }

const wIcon = id => `<svg class="wic" viewBox="0 0 64 20" fill="currentColor" aria-hidden="true">${WICON[K.W[id].cat]}</svg>`;
const NADE_IC = { fl: '✦', sm: '☁', mo: '🔥', he: '💥' };
const ACT_IC = {
  hold: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  peek: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12"/><path d="m13 6 6 6-6 6"/><path d="M3 5v14"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H7"/><path d="m11 6-6 6 6 6"/></svg>',
  defuse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="2"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/><path d="M12 12v3"/></svg>'
};
function actName(a, side, ctype) { if (a === 'back' && ctype === 'retake') return 'Сейв'; return { hold: 'Держать угол', peek: 'Выйти', back: 'Отойти', defuse: 'Дефьюз' }[a]; }

/* ---------------- матч ---------------- */
// M: { mode: 'bot'|'online', seed, picks: [[p0,p1],...] }. S: состояние движка. me: моё место.
let M = null, S = null, me = 0, applied = 0, D = {}, rq = [], rvOpen = false, rvPages = [], rvTimers = [], mapFrozen = false;
const opp = () => 1 - me;
function names() {
  if (!M) return ['Ты', 'Соперник'];
  if (M.mode === 'bot') return [myName() || 'Ты', 'Бот'];
  const r = net.room; return [0, 1].map(k => (r && r.names[k]) || (k === 0 ? 'Игрок 1' : 'Игрок 2'));
}
const myName = () => String(store.get('name', '') || '').trim().slice(0, 12);
const sideOf = k => S ? S.sideOf[k] : (k === 0 ? 'T' : 'CT');
const who = k => k === me ? 'Ты' : esc(names()[k]);

function rebuild(showLast) {
  if (!M) { S = null; return; }
  S = K.create(M.seed); applied = 0; rq = []; rvPages = [];
  advance(!showLast);
  D = { n: -1 };
}
// Применяет все шаги, где уже есть выборы обоих. quiet — не показывать вскрытия.
function advance(quiet) {
  if (!M || !S) return;
  let progressed = false;
  for (let guard = 0; guard < 2000; guard++) {
    if (S.over) break;
    const pd = K.pending(S);
    if (M.mode === 'bot') botFill();
    const r2 = M.picks[applied];
    if (!r2) break;
    if (![0, 1].every(k => !pd.seats[k] || r2[k] != null)) break;
    const pk = [pd.seats[0] ? r2[0] : null, pd.seats[1] ? r2[1] : null];
    if (!K.valid(S, 0, pk[0]) || !K.valid(S, 1, pk[1])) {
      console.warn('kst: bad pick', applied, pk);
      if (!K.valid(S, me, pk[me])) r2[me] = null;
      if (!K.valid(S, opp(), pk[opp()]) && M.mode === 'online') { r2[opp()] = null; hello(); }
      break;
    }
    const batch = K.apply(S, pk); applied++; progressed = true;
    if (!quiet) { rq.push(batch); if (batch.some(x => x.t === 'end' || x.t === 'map')) mapFrozen = true; }
  }
  if (M.mode === 'bot') saveSolo();
  render();
  if (progressed && !quiet) showReveal();
}
function botFill() {
  if (S.over) return;
  const pd = K.pending(S), b = opp();
  if (!pd.seats[b]) return;
  const row = M.picks[applied] || (M.picks[applied] = [null, null]);
  if (row[b] == null) row[b] = K.bot(S, b);
}
function myPickNeeded() { if (!S || S.over) return false; const pd = K.pending(S); return pd.seats[me] && !(M.picks[applied] && M.picks[applied][me] != null); }
function submit(p) {
  if (!myPickNeeded()) return;
  if (!K.valid(S, me, p)) { toast('Так нельзя'); return; }
  if (M.mode === 'online' && net.status !== 'ok') { toast('Нет связи. Подожди пару секунд'); return; }
  const row = M.picks[applied] || (M.picks[applied] = [null, null]);
  row[me] = p;
  sfx.ready(); buzz(15);
  if (M.mode === 'online') { send('pick', { g: net.room.game, i: applied, k: me, p }); saveRoom(); }
  advance();
}
function saveSolo() { if (M && M.mode === 'bot') store.set('solo', { seed: M.seed, picks: M.picks, v: BUILD }); }
function startBot(resume) {
  if (net.on) leaveRoom();
  const snap = store.get('solo', null);
  if (resume && snap && snap.seed && SOLO_OK.includes(snap.v)) M = { mode: 'bot', seed: snap.seed, picks: snap.picks || [] };
  else M = { mode: 'bot', seed: 'solo-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), picks: [] };
  me = 0; rebuild(false); closeSheet(); render();
}

/* ---------------- рендер ---------------- */
function render() {
  renderSound();
  document.body.classList.toggle('bomb', !!(S && S.R && S.R.bomb && !S.over && S.step === 'fight'));
  document.body.classList.toggle('hurry', !!(S && S.R && S.R.bomb && S.R.bomb.left <= 1));
  if (!S) { $('#panel').innerHTML = ''; $('#sum').textContent = ''; $('#btnGo').disabled = true; $('#rbar').innerHTML = ''; return; }
  if (D.n !== S.n) { D = { n: S.n }; $('#panel').scrollTop = 0; }
  document.documentElement.style.setProperty('--side', sideOf(me) === 'CT' ? 'var(--ct)' : 'var(--t)');
  renderBoard(); renderMap(); renderRbar();
  const pd = K.pending(S);
  const myTurn = myPickNeeded();
  const bar = { sum: '', go: null, label: 'Готово' };
  let html;
  if (S.over) html = viewOver(bar);
  else if (!myTurn) html = viewWait(pd, bar);
  else html = ({ maps: viewMaps, side: viewSide, buy: viewBuy, plan: viewPlan, plan2: viewPlan, plant: viewPlant, fight: viewFight }[S.step] || (() => ''))(bar);
  const panel = $('#panel');
  const key = S.n + ':' + (myTurn ? 1 : 0);
  if (panel.dataset.key !== key) { panel.dataset.key = key; panel.innerHTML = html; }
  else { const st = panel.scrollTop; panel.innerHTML = html; panel.scrollTop = st; panel.querySelectorAll(':scope > *').forEach(x => x.style.animation = 'none'); }
  $('#sum').innerHTML = bar.sum || '';
  const go = $('#btnGo');
  go.textContent = bar.label; go.disabled = !bar.go; go.onclick = bar.go || null; go.hidden = !!bar.hideGo;
}

function renderBoard() {
  const N = names(), pre = S.step === 'maps' || S.step === 'side';
  for (const [el, k] of [[$('#plMe'), me], [$('#plOp'), opp()]]) {
    const side = sideOf(k), inv = S.inv[k], hp = S.hp[k], isMe = k === me;
    el.className = 'pl ' + (isMe ? 'me' : 'op') + (side === 'CT' ? ' ct' : '');
    if (pre) el.style.setProperty('--c', 'var(--line2)'); else el.style.removeProperty('--c');
    let gear = '';
    const seen = isMe || (S.R && S.R.seen[k]);
    if (!pre && S.R) {
      if (seen) { const w = K.weaponOf(S, k); gear = wIcon(w) + `<span>${esc(K.W[w].name)}${inv.armor === 2 ? ' · шлем' : inv.armor === 1 ? ' · броня' : ''}</span>`; }
      else gear = '<span>оружие скрыто</span>';
    }
    el.innerHTML = `<div class="pl-row"><span class="badge"${pre ? ' style="color:var(--fg)"' : ''}>${pre ? '?' : side}</span><span class="pl-name">${esc(isMe ? (myName() || 'Ты') : N[k])}</span></div>
      <div class="money">${fmt$(S.money[k])}</div>
      <div class="hpbar${hp <= 40 ? ' low' : ''}"><span style="width:${Math.max(0, hp)}%"></span></div>
      <div class="gear">${gear}</div>`;
  }
  $('#scMe').textContent = S.score[me]; $('#scOp').textContent = S.score[opp()];
  let ri = 'до 8 побед';
  if (S.round) ri = `Раунд ${S.round}` + (S.half === 3 ? ' · решающий' : (S.round === 1 || S.round === K.HALF + 1) ? ' · пистолетка' : '');
  $('#rInfo').textContent = ri;
}

/* --- полоса раунда: сколько ходов осталось --- */
function pipsHTML(total, used, cls) {
  let h = `<span class="pips ${cls || ''}">`;
  for (let i = 0; i < total; i++) h += `<i class="${i < used ? 'used' : i === used ? 'now' : 'left'}"></i>`;
  return h + '</span>';
}
function renderRbar() {
  const el = $('#rbar'), R = S.R;
  el.className = 'rbar';

  if (S.over) { el.innerHTML = `<span class="lbl2">МАТЧ ОКОНЧЕН</span><span class="hint">${S.score[me]} : ${S.score[opp()]}</span>`; return; }
  if (!R || S.step === 'buy') { el.innerHTML = `<span class="lbl2">🛒 ЗАКУПКА</span><span class="hint">потом план и 5 ходов на раунд</span>`; return; }

    el.innerHTML = `<span class="lbl2">💣 ${pipsHTML(total, total - R.bomb.left, 'bomb')}</span><span class="hint"><b style="color:var(--red)">до взрыва ${R.bomb.left} ${plural(R.bomb.left, 'ход', 'хода', 'ходов')}</b><br>дефьюз ${R.bomb.prog}/${need}${iAmT ? '' : (S.inv[me].kit ? ' · с китом' : ' · без кита')}</span>`;

}

/* --- мини-карта --- */
const MZ = { A: [14, 30, 104, 54], M: [146, 62, 68, 40], B: [242, 30, 104, 54] };
const MP = { tSpawn: [180, 121], ctSpawn: [180, 36], Ae: [66, 99], Be: [294, 99], Me: [180, 108], Mc: [180, 82], Atop: [66, 21], Btop: [294, 21], Mtop: [180, 48] };
function posXY(site, idx, d) {
  if (site === 'M') return [[163, 197][idx] || 180, { 0: 94, 1: 82, 2: 70 }[d]];
  const x0 = site === 'A' ? 0 : 228;
  return [x0 + ([34, 66, 98][idx] || 66), { 0: 74, 1: 58, 2: 41 }[d]];
}
function ctPosXY(id) { const m = K.MAPS[S.map], p = m.ct.find(x => x.id === id); if (!p) return null; const idx = m.ct.filter(x => x.site === p.site).indexOf(p); return posXY(p.site, idx, p.d); }
function ppXY(site, id) { const arr = K.MAPS[S.map].pp[site], i = arr.findIndex(x => x.id === id); const p = arr[i]; const x0 = site === 'A' ? 0 : 228; return [x0 + [34, 78][i], { 0: 72, 1: 60, 2: 46 }[p.d]]; }
let mapBuiltFor = null;
function buildMap() {
  const svg = $('#mapSvg');
  let h = `<defs><marker id="arT" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#E9A23B"/></marker></defs>`;
  h += ['M150 140 H66 V84', 'M210 140 H294 V84', 'M180 132 V102', 'M146 82 H118', 'M214 82 H242', 'M150 13 H66 V30', 'M210 13 H294 V30', 'M180 22 V62'].map(d => `<path class="lane" d="${d}"/>`).join('');
  for (const k of ['A', 'M', 'B']) { const [x, y, w, hh] = MZ[k]; h += `<rect class="zone" id="z${k}" x="${x}" y="${y}" width="${w}" height="${hh}" rx="11"/><text class="zl${k === 'M' ? ' small' : ''}" x="${x + w / 2}" y="${y + hh / 2}">${k === 'M' ? 'МИД' : k}</text>`; }
  h += `<rect x="150" y="4" width="60" height="18" rx="5" fill="#14304C"/><text class="spawn" x="180" y="13" fill="#5BAAF2">CT</text>`;
  h += `<rect x="150" y="132" width="60" height="16" rx="5" fill="#4A3313"/><text class="spawn" x="180" y="140" fill="#E9A23B">T</text>`;
  h += `<g id="mDots"></g><g id="mDyn"></g>`;
  const mk = (id, col, lbl) => `<g class="mk" id="${id}" style="opacity:0"><circle class="ring" r="9" stroke="${col}"/><circle class="core" r="9" fill="${col}"/><text>${lbl}</text></g>`;
  h += mk('mkCT', '#5BAAF2', 'CT') + mk('mkT', '#E9A23B', 'T');

}
function setMk(id, xy, show, dead, isMe) {
  const g = document.getElementById(id); if (!g) return;
  if (xy) g.style.transform = `translate(${xy[0]}px, ${xy[1]}px)`;
  g.style.opacity = show ? 1 : 0;
  g.classList.toggle('dead', !!dead);

}
function renderMap() {
  if (mapFrozen && (rvOpen || rq.length || rvPages.length)) return; // пока идёт вскрытие конца раунда, карта показывает, где всё случилось
  mapFrozen = false;
  if (mapBuiltFor !== (S.map || '-') || !document.getElementById('mkT')) buildMap();
  const m = S.map ? K.MAPS[S.map] : null;
  $('#mapName').textContent = m ? m.name.toUpperCase() : 'ВЫБОР КАРТЫ';
  const R = S.R, t = K.tSeat(S), ct = 1 - t, iAmT = me === t;
  const dots = $('#mDots'), dyn = $('#mDyn');
  let dh = '', yh = '';
  const hot = new Set();
  for (const k of ['A', 'M', 'B']) document.getElementById('z' + k).setAttribute('class', 'zone');
  let tAt = MP.tSpawn, ctAt = MP.ctSpawn, showT = !!m, showCT = !!m;
  const myPick = myPickNeeded();
  if (m && R && S.step !== 'buy') {
    const c = R.contact;
    // точки позиций CT видны CT во время плана; T видит их как «возможные места»
    if ((S.step === 'plan' || S.step === 'plan2') && !c) {
      for (const p of m.ct) { const [x, y] = ctPosXY(p.id); const sel = !iAmT && D.p === p.id; dh += `<circle class="pdot d${p.d}${sel ? ' sel' : ''}" cx="${x}" cy="${y}" r="${sel ? 6 : 4}"/>`; if (sel) yh += `<text class="plabel" x="${x}" y="${y - 12}">${esc(p.name)}</text>`; }
    }
    if (R.bomb) {
      const s = R.bomb.site;
      document.getElementById('z' + s).setAttribute('class', 'zone bombz');
      if (R.bomb.pos) tAt = ppXY(s, R.bomb.pos);
      else if (S.step === 'plant' && iAmT && D.p) tAt = ppXY(s, D.p);
      else tAt = posXY(s, 1, 1);
      ctAt = s === 'A' ? MP.Atop : MP.Btop;
      if (S.step === 'plant') for (const p of m.pp[s]) { const [x, y] = ppXY(s, p.id); const sel = D.p === p.id; dh += `<circle class="pdot d${p.d}${sel ? ' sel' : ''}" cx="${x}" cy="${y}" r="${sel ? 6 : 4}"/>`; if (sel || iAmT) yh += `<text class="plabel" x="${x}" y="${y + 13}">${esc(p.name)}</text>`; }
      const bx = s === 'A' ? 104 : 332;
      yh += `<g class="bombic"><circle cx="${bx}" cy="44" r="8" fill="#FF5454"/><text x="${bx}" y="45" font-size="9" text-anchor="middle" dominant-baseline="central">💣</text></g>`;

      else { tAt = c.site === 'A' ? MP.Ae : MP.Be; ctAt = ctPosXY(c.pos) || (c.site === 'A' ? MP.Atop : MP.Btop); hot.add(c.site); }
      if (c.posName) yh += `<text class="plabel" x="${ctAt[0]}" y="${ctAt[1] - 14}">${esc(c.posName)}</text>`;
    } else {
      if (R.ctrlMid) tAt = MP.Mc;

      if (!iAmT && myPick && D.p) { const xy = ctPosXY(D.p); if (xy) ctAt = xy; }
      if (iAmT && myPick && D.r) {

        if (routes[D.r]) yh += `<path class="route" d="${routes[D.r]}" marker-end="url(#arT)"/>`;
        document.getElementById('z' + D.r).setAttribute('class', 'zone pick');
      }

  }

  dots.innerHTML = dh; dyn.innerHTML = yh;
  setMk('mkT', tAt, showT, S.R && !S.alive[t], me === t);
  setMk('mkCT', ctAt, showCT, S.R && !S.alive[ct], me === ct);
}

/* --- общие куски --- */

function cardCls(c) { const C = K.CARDS[c]; return C.kind === 'num' ? (C.val > 0 ? 'pos' : C.val < 0 ? 'neg' : 'cond') : C.kind === 'hs' ? 'hs' : 'cond'; }
function cardBig(c) { const C = K.CARDS[c]; return C.kind === 'num' ? (C.val > 0 ? '+' + C.val : C.val < 0 ? '−' + (-C.val) : '0') : C.kind === 'hs' ? '☠' : C.kind === 'pre' ? '+3' : C.kind === 'cs' ? '+2' : (c === 'tap' ? 'ТАП' : 'СПРЕЙ'); }

const situ = (ic, title, text) => `<div class="situ"><div class="ic">${ic}</div><div><b class="st">${title}</b><span>${text}</span></div></div>`;

/* --- карты и сторона --- */
function viewMaps(bar) {
  D.m = D.m || [];
  let h = situ('🗺️', 'Выбор карты', 'Отметь 2 карты. Соперник тоже выбирает 2, потом рулетка крутит одну из четырёх. Цифра CT — как часто в про-играх побеждает защита.');

  h += `</div>`;

}
function viewSide(bar) {
  const m = K.MAPS[S.map];

  return situ('🔪', 'Выбери сторону', `${m.name}: CT выигрывают ${m.ctPct}% раундов в про-сцене. ${esc(m.tag)}.`) +

  if ((s.sv | 0) > (r.sv | 0) || (filledSeats(s) > filledSeats(r) && (s.sv | 0) >= (r.sv | 0))) { r.seats = s.seats; r.sv = s.sv; ch = true; }
  s.names.forEach((x, i) => { if (x && r.names[i] !== x && r.seats[i] !== myId) { r.names[i] = x; ch = true; } });
  if (mergePicks(r.picks, s.picks)) ch = true;
  if (ch) { saveRoom(); bindOnline(true); }
  if (before >= 0 && mySeatOnline() < 0) toast('Твоё место заняли с другого окна или телефона');
  refreshOnline();
}
function onPick(m) {
  const r = net.room; if (!r) { hello(); return; }
  const g = m.g | 0, i = m.i | 0, k = m.k | 0;
  if (g !== r.game) { if (g > r.game) hello(); return; }
  if (k !== 0 && k !== 1 || r.seats[k] !== m.from) return;
  if (i > r.picks.length) { hello(); return; }
  if (!r.picks[i]) r.picks[i] = [null, null];
  if (r.picks[i][k] == null) { r.picks[i][k] = cleanPick(m.p); saveRoom(); if (M && M.mode === 'online') advance(); }
}
// Привязать онлайн-комнату к матчу. keep — не пересобирать с нуля, а догнать.
function bindOnline(keep) {
  const r = net.room; if (!r) return;
  const seed = r.code + ':' + r.game;
  const seat = r.seats.indexOf(myId);
  if (keep && M && M.mode === 'online' && M.seed === seed && S) { M.picks = r.picks; me = seat >= 0 ? seat : 0; advance(); return; }
  M = { mode: 'online', seed, picks: r.picks }; me = seat >= 0 ? seat : 0;
  rebuild(false);
  render();
}
function onlineRematch() { const r = net.room; if (!r) return; const g = r.game + 1; applyRematch(g, null); send('rematch', { g }); send('state', { room: net.room }); }
function applyRematch(g, from) {
  const r = net.room; if (!r) return;
  if (g <= r.game) return; if (g > r.game + 1) { hello(); return; }
  r.game = g; r.picks = []; saveRoom(); bindOnline();
  if (from) toast('Соперник начал реванш');
  refreshOnline();
}
function refreshOnline() {
  if (!net.on) return;
  const r = net.room;
  if (r && started(r) && !net.wasStarted) {
    net.wasStarted = true;
    if (slots(r) === 0 && net.everOk) { toast('Оба в комнате. Поехали!'); sfx.ready(); }
    closeSheet();
  }
  if (r && M && M.mode === 'online') { const seat = r.seats.indexOf(myId); if (seat >= 0 && seat !== me) { me = seat; render(); } }
  $('#roomPill').hidden = false; $('#roomPillCode').textContent = net.code || '';
  $('#roomDot').className = 'dot' + (net.status === 'ok' && r && r.seats.every(id => id && (id === myId || net.online.has(id))) ? ' on' : '');
  renderRoomPanel();
}
function showRoomPanel() { sheet.hidden = false; $('#vMain').hidden = true; $('#vRoom').hidden = false; renderRoomPanel(); }
function renderRoomPanel() {
  if (!net.on) return;
  const r = net.room;
  $('#roomCode').textContent = net.code || '····';
  $('#roomLink').textContent = inviteUrl();
  $('#btnShare').textContent = navigator.share ? 'Поделиться ссылкой' : 'Скопировать ссылку';
  const box = $('#seats'); box.innerHTML = '';
  if (r) r.seats.forEach((id, k) => {
    const d = document.createElement('div'); d.className = 'seat';
    let st = 'ждём…', on = false;
    if (id === myId) { st = 'ты'; on = net.status === 'ok'; } else if (id && net.online.has(id)) { st = 'в сети'; on = true; } else if (id) st = 'не в сети';
    d.innerHTML = `<span class="badge" style="background:${k === 0 ? 'var(--t)' : 'var(--ct)'}">${k + 1}</span><span class="pl-name"></span><span class="st${on ? ' on' : ''}">${st}</span>`;
    d.querySelector('.pl-name').textContent = id ? (r.names[k] || ('Игрок ' + (k + 1))) : 'Свободно';
    box.appendChild(d);
  });
  const note = $('#netNote'); let txt, err = false;
  if (net.errorMsg) { txt = net.errorMsg; err = true; }
  else if (net.status === 'connecting') txt = 'Подключаюсь…';
  else if (net.status === 'lost') txt = 'Связь пропала, переподключаюсь…';
  else if (!r) txt = 'Ищу комнату…';
  else if (!started(r)) txt = 'Отправь брату ссылку или код. Игра начнётся, когда он зайдёт.';
  else txt = 'Оба на месте.';
  note.textContent = txt; note.className = 'netnote' + (err ? ' err' : '');
  $('#btnRoomGo').hidden = !(r && started(r));
}
$('#btnShare').onclick = async () => {
  const url = inviteUrl();
  if (navigator.share) { try { await navigator.share({ title: 'КС-тактика', text: 'Заходи в КС-тактику, код ' + net.code, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); toast('Ссылка скопирована'); } catch (e) { toast('Скопируй ссылку вручную'); }
};
$('#btnLeave').onclick = () => { leaveRoom(); openSheet(); };
$('#btnRoomGo').onclick = closeSheet;
document.addEventListener('visibilitychange', () => { if (!document.hidden && net.on) { if (net.status !== 'ok' && net.ch) { /* realtime сам переподключится */ } hello(); ping(); } });
window.addEventListener('hashchange', () => { const c = codeFromHash(); if (c && (!net.on || net.code !== c)) joinRoom(c); });

/* ---------------- старт ---------------- */
(function boot() {
  renderSound();
  const c = codeFromHash();
  if (c) { joinRoom(c); return; }
  openSheet();
  render();
})();
</script>
